<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#08111f" name="theme-color"/><title>Vale Empires — Offline</title><style>html,body{height:100%;margin:0;background:#08111f;color:#f4e3b3;font-family:Georgia,serif}body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.card{max-width:520px;padding:24px;border:1px solid #a9823a;border-radius:18px;background:linear-gradient(#122a43,#07101c);box-shadow:0 24px 50px #0008}img{width:140px;max-width:45vw;margin:auto}button{padding:12px 18px;border:1px solid #d7b55e;border-radius:10px;background:#77571f;color:#fff0c2;font-weight:bold}</style></head><body><main><img alt="Vale Empires" src="assets/pwa/icon-192.png"/><h1 id="offlineTitle">Você está offline</h1><p id="offlineText">O jogo não conseguiu acessar a rede. Abra novamente quando houver conexão ou use a versão já instalada em cache.</p><button id="offlineButton" onclick="location.reload()">TENTAR NOVAMENTE</button></main><script>(function(){const l=(localStorage.getItem('valeEmpires.language')||navigator.language||'pt-BR').toLowerCase();const en=l.startsWith('en'),es=l.startsWith('es');document.documentElement.lang=en?'en-US':es?'es-ES':'pt-BR';document.getElementById('offlineTitle').textContent=en?'You are offline':es?'Estás sin conexión':'Você está offline';document.getElementById('offlineText').textContent=en?'The game could not reach the network. Try again when connected or use the version already stored in cache.':es?'El juego no pudo acceder a la red. Inténtalo de nuevo cuando haya conexión o usa la versión guardada en caché.':'O jogo não conseguiu acessar a rede. Abra novamente quando houver conexão ou use a versão já instalada em cache.';document.getElementById('offlineButton').textContent=en?'TRY AGAIN':es?'INTENTAR DE NUEVO':'TENTAR NOVAMENTE';})();</script></body></html>
